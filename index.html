<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segredos Rasgados</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300&display=swap" rel="stylesheet">
</head>

<body>

<div id="overlay"></div>

<div id="login">

    <div class="halo"></div>

    <h1>SEGREDOS RASGADOS</h1>

    <p>Digite a senha</p>

    <input
        type="password"
        id="senha"
        placeholder="Senha">

    <button onclick="entrar()">
    ENTRAR
</button>

<div id="mensagemSecreta"></div>

<span id="erro"></span>

<div class="frase">
        "Nem toda verdade merece ser descoberta."
    </div>

</div>

<div id="revelacao">

    <img id="imagem" src="revelacao.png">
        
   

    <h2 id="texto"></h2>

</div>

<div class="senha-container">
    <h2>Digite a senha</h2>

    <input type="password" id="senha" placeholder="Senha...">

    <button onclick="verificarSenha()">Abrir</button>

    <p id="mensagem"></p>

    <img id="imagemSecreta" src="stacy.jpg" alt="Imagem secreta">
</div>

<script src="script.js"></script>

</body>
</html>
